<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12508f">
<!-- iPhone：ホーム画面に追加したときアプリのように全画面で開く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="法定点検">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>車両法定点検</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="appbar">
  <h1>車両法定点検</h1>
  <span class="env" id="env-label">―</span>
</div>

<main>
  <div id="pending-banner" class="banner warn" style="display:none"></div>


  <div class="card">
    <h2>QRコードを読み取ってください</h2>
    <p class="small muted">
      車両キープレートに貼ってあるQRシールを、枠の中に写してください。<br>
      読み取ると自動で次の画面に進みます。
    </p>
    <div id="reader"></div>
    <p class="scan-hint" id="scan-hint">カメラを起動しています…</p>
    <button class="btn secondary" id="btn-restart" style="display:none">カメラを再起動する</button>
  </div>

  <div class="card">
    <h2>QRが読めないとき</h2>
    <label class="field">
      <span id="manual-id-hint">管理番号を直接入力（例：DC4-0737）</span>
      <input type="text" id="manual-id" placeholder="DC4-0737" autocapitalize="characters" autocomplete="off">
    </label>
    <div id="suggest"></div>
    <button class="btn secondary" id="btn-manual">この管理番号で進む</button>

    <label class="field" style="margin-top:18px">
      <span>QRコードの画像ファイルから読み取る（PCでの確認用）</span>
      <input type="file" id="qr-file" accept="image/*">
    </label>
  </div>

  <div class="card" id="demo-vehicles" style="display:none">
    <h2>デモ用の車両</h2>
    <p class="small muted">QRシールが手元に無いときは、ここから車両を選んで試せます。</p>
    <ul class="list" id="demo-vehicle-list"></ul>
  </div>
  <p class="center small"><a class="plain" href="admin.html">管理メニュー（マスタ取込・QR再発行・動作テスト）</a></p>
</main>

<script src="config/app-config.js"></script>
<script src="config/firebase-config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="vendor/firebase-storage-compat.js"></script>
<script src="vendor/html5-qrcode.min.js"></script>
<script src="src/common/util.js"></script>
<script src="src/storage/StorageAdapter.js"></script>
<script src="src/storage/LocalStorageAdapter.js"></script>
<script src="src/storage/FirebaseStorageAdapter.js"></script>
<script src="src/auth/AuthProvider.js"></script>
<script src="src/storage/storageFactory.js"></script>
<script src="src/offline/syncQueue.js"></script>
<script src="src/qr/scanner.js"></script>
<script>
/* ---------------------------------------------------------------------------
 * トップ画面：QRを読み取り、車両マスタと照合して分岐画面へ進む
 * ------------------------------------------------------------------------ */
(async function () {
  const VIS = window.VIS;
  const $ = VIS.util.$;

  await VIS.ready();
  $('#env-label').textContent = VIS.storage.name;
  VIS.queue.autoFlush();

  // デモ版：収録している車両を一覧で出す（実車には印を付ける）
  if (VIS.isDemo()) {
    const rows = await VIS.storage.searchVehicles('', 30);
    $('#demo-vehicle-list').innerHTML = rows.map(v => `
      <li><a class="plain" href="vehicle.html?id=${encodeURIComponent(v.vehicleId)}">
        <b>${VIS.util.esc(v.vehicleId)}</b>　${VIS.util.esc(v.vehicleType)}
        ${v.demo === false ? '<span class="badge-opt">実車</span>' : ''}</a></li>`).join('');
    $('#demo-vehicles').style.display = 'block';
    const real = rows.find(v => v.demo === false) || rows[0];
    if (real) {
      $('#manual-id').placeholder = real.vehicleId;
      $('#manual-id-hint').textContent = `管理番号を直接入力（例：${real.vehicleId}）`;
    }
  }

  // 保留データがあれば知らせる
  const pending = await VIS.queue.count();
  if (pending > 0) {
    const b = $('#pending-banner');
    b.style.display = 'block';
    b.textContent = `未送信の点検データが ${pending} 件あります。オンラインになると自動で送信します。`;
  }

  let busy = false;

  /** 読み取った管理番号で車両を探し、見つかれば分岐画面へ */
  async function go(vehicleId, rawText) {
    if (busy) return;
    busy = true;
    try {
      if (!vehicleId) throw new Error('QRの内容が空でした');

      const vehicle = await VIS.storage.getVehicle(vehicleId);
      if (!vehicle) {
        VIS.util.toast(`「${vehicleId}」は車両マスタに見つかりません`, 'err');
        if (rawText && rawText !== vehicleId) {
          console.info('QRの生データ:', rawText, '→ 正規化後:', vehicleId);
        }
        busy = false;
        return;
      }
      await scanner.stop();
      location.href = `vehicle.html?id=${encodeURIComponent(vehicleId)}`;
    } catch (e) {
      VIS.util.toast(e.message, 'err');
      busy = false;
    }
  }

  // ------------------------------------------------------------- カメラ読み取り
  const scanner = new VIS.QrScanner('reader');

  async function startCamera() {
    try {
      await scanner.start((id, raw) => {
        $('#scan-hint').textContent = `読み取り：${raw}`;
        go(id, raw);
      });
      $('#scan-hint').textContent = 'QRを枠の中に合わせてください';
      $('#btn-restart').style.display = 'none';
    } catch (e) {
      $('#scan-hint').textContent =
        'カメラを起動できませんでした。下の「管理番号を直接入力」または画像ファイルからの読み取りをお使いください。';
      $('#btn-restart').style.display = 'block';
      console.warn(e);
    }
  }
  startCamera();
  $('#btn-restart').addEventListener('click', startCamera);

  // ----------------------------------------------------------------- 手入力
  const input = $('#manual-id');
  $('#btn-manual').addEventListener('click', () => {
    go(VIS.util.normalizeVehicleId(input.value));
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-manual').click(); });

  // 入力中に候補を出す
  let t;
  input.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const kw = VIS.util.normalizeVehicleId(input.value);
      const box = $('#suggest');
      if (kw.length < 2) { box.innerHTML = ''; return; }
      const rows = await VIS.storage.searchVehicles(kw, 8);
      box.innerHTML = rows.length
        ? '<ul class="list">' + rows.map(v =>
            `<li><a class="plain" href="vehicle.html?id=${encodeURIComponent(v.vehicleId)}">
               <b>${VIS.util.esc(v.vehicleId)}</b>　${VIS.util.esc(v.vehicleType)}　${VIS.util.esc(v.plateNumber)}</a></li>`
          ).join('') + '</ul>'
        : '<p class="small muted">該当なし</p>';
    }, 250);
  });

  // ------------------------------------------------------- 画像ファイルから読む
  $('#qr-file').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const r = await VIS.QrScanner.decodeFile(f);
      VIS.util.toast(`読み取り: ${r.rawText}`, 'ok');
      go(r.vehicleId, r.rawText);
    } catch (err) {
      VIS.util.toast('画像からQRを読み取れませんでした', 'err');
    }
  });

  // ------------------------------------------------------------- PWA登録
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW登録失敗', e));
  }
})();
</script>
</body>
</html>
