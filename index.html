<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123c56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="点検QR">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png"><title>点検QRポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f3ec; --surface:#ffffff; --surface-2:#fbf9f4;
  --ink:#1c2430; --ink-soft:#5b6572; --ink-faint:#8a93a0;
  --line:#ddd6c6; --line-strong:#c7bfa9;
  --accent:#1f5f86; --accent-strong:#123c56; --accent-soft:#e4eef3;
  --ok:#2f7a4f; --ok-soft:#e3f2e8;
  --ng:#b6432c; --ng-soft:#fbe9e4;
  --warn:#c1861f; --warn-soft:#fbf1de;
  --focus:#1f5f86;
  --shadow: 0 1px 2px rgba(28,36,48,.06), 0 4px 14px rgba(28,36,48,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161d; --surface:#1a222c; --surface-2:#161d25;
    --ink:#edf0f3; --ink-soft:#aab4c0; --ink-faint:#7c8794;
    --line:#2c3947; --line-strong:#3a4a5a;
    --accent:#68abd6; --accent-strong:#9bcbea; --accent-soft:#1c2f3d;
    --ok:#63c187; --ok-soft:#173023;
    --ng:#e08669; --ng-soft:#3a2119;
    --warn:#e0b761; --warn-soft:#3a2c11;
    --focus:#68abd6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#11161d; --surface:#1a222c; --surface-2:#161d25;
  --ink:#edf0f3; --ink-soft:#aab4c0; --ink-faint:#7c8794;
  --line:#2c3947; --line-strong:#3a4a5a;
  --accent:#68abd6; --accent-strong:#9bcbea; --accent-soft:#1c2f3d;
  --ok:#63c187; --ok-soft:#173023;
  --ng:#e08669; --ng-soft:#3a2119;
  --warn:#e0b761; --warn-soft:#3a2c11;
  --focus:#68abd6;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Noto Serif JP",serif; text-wrap:balance; margin:0}
a{color:var(--accent)}
button{font-family:inherit}

.topbar{
  position:sticky; top:0; z-index:10; background:var(--surface);
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:.6rem;
  padding:.75rem 1rem;
}
.topbar .mark{
  width:34px;height:34px;border-radius:9px;background:var(--accent-strong);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex:none;
}
.topbar .title{font-family:"Noto Serif JP",serif;font-weight:700;font-size:1.02rem;letter-spacing:.02em}
.topbar .sub{font-size:.72rem;color:var(--ink-soft)}
.topbar .back{
  margin-left:auto;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  padding:.4rem .75rem;border-radius:8px;font-size:.8rem;cursor:pointer;
}
.topbar .back:hover{border-color:var(--line-strong)}

.container{max-width:720px;margin:0 auto;padding:1.1rem 1rem 4rem}

.banner{
  background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;
  padding:.85rem 1rem;font-size:.82rem;color:var(--ink-soft);line-height:1.65;margin-bottom:1.2rem;
}
.banner b{color:var(--ink)}

.section-label{
  font-size:.72rem;letter-spacing:.08em;color:var(--ink-faint);
  margin:1.6rem 0 .6rem;font-weight:700;
}
.section-label:first-child{margin-top:0}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:1.1rem;box-shadow:var(--shadow); margin-bottom:.9rem;
}

.scan-hero{
  background:var(--accent-strong);border-radius:16px;padding:1.4rem 1.2rem;color:#fff;
  display:flex;flex-direction:column;gap:.7rem;margin-bottom:1rem;
}
.scan-hero h2{font-size:1.1rem;color:#fff}
.scan-hero p{margin:0;font-size:.82rem;line-height:1.6;color:rgba(255,255,255,.82)}
.scan-hero button{
  appearance:none;border:none;background:#fff;color:var(--accent-strong);
  padding:.85rem 1rem;border-radius:10px;font-size:.98rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;
}
.scan-hero button:hover{background:#eef4f8}
.scan-hero button:focus-visible{outline:3px solid #fff;outline-offset:2px}

.pill{
  display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;
  padding:.2rem .55rem;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);
  letter-spacing:.02em;
}

.btn{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);
  padding:.55rem .9rem;border-radius:9px;font-size:.84rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem;line-height:1.2;
}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.btn.primary:hover{background:var(--accent)}
.btn.block{width:100%;justify-content:center;padding:.8rem 1rem;font-size:.92rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.rowbtns{display:flex;gap:.5rem;margin-top:.3rem;flex-wrap:wrap}

.step-btn{
  display:flex;align-items:flex-start;gap:.8rem;width:100%;text-align:left;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  padding:.85rem .95rem;border-radius:11px;cursor:pointer;margin-bottom:.55rem;
}
.step-btn:hover{border-color:var(--accent)}
.step-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.step-btn .num{
  flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-strong);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;
}
.step-btn.done .num{background:var(--ok)}
.step-btn .txt{flex:1;min-width:0}
.step-btn .t{font-size:.92rem;font-weight:700}
.step-btn .d{font-size:.76rem;color:var(--ink-soft);margin-top:.15rem;line-height:1.5}

.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.8rem}
.field label{font-size:.76rem;color:var(--ink-soft);font-weight:700}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  border:1px solid var(--line-strong);border-radius:8px;padding:.6rem .7rem;font-size:.9rem;
  background:var(--surface);color:var(--ink);font-family:inherit;width:100%;
}
.field textarea{resize:vertical;min-height:4.2em}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.radio2{display:flex;gap:1.1rem;font-size:.86rem}
.radio2 label{display:flex;align-items:center;gap:.35rem;font-weight:400;color:var(--ink)}

.hit{
  display:flex;align-items:center;gap:.7rem;padding:.7rem .2rem;border-top:1px solid var(--line);
  cursor:pointer;
}
.hit:first-of-type{border-top:none}
.hit:hover{background:var(--surface-2)}
.hit .id{font-size:.72rem;font-weight:700;color:var(--accent);min-width:88px;font-variant-numeric:tabular-nums}
.hit .body{flex:1;min-width:0}
.hit .reg{font-size:.92rem;font-weight:700}
.hit .kind{font-size:.75rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .chev{color:var(--ink-faint);flex:none}

#scanStage{display:flex;flex-direction:column;gap:.8rem;align-items:center}
#scanVideo{
  width:100%;max-width:420px;border-radius:14px;background:#000;aspect-ratio:3/4;object-fit:cover;
  border:1px solid var(--line);
}
.scan-hint{font-size:.82rem;color:var(--ink-soft);text-align:center;line-height:1.6}
.scan-status{
  font-size:.8rem;font-weight:700;padding:.5rem .9rem;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);
}
.scan-status.ok{background:var(--ok-soft);color:var(--ok)}
.scan-status.err{background:var(--ng-soft);color:var(--ng)}

.accordion{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:.7rem;background:var(--surface)}
.accordion > summary{
  list-style:none;cursor:pointer;padding:.8rem .95rem;display:flex;align-items:center;justify-content:space-between;
  font-weight:700;font-size:.92rem;background:var(--surface-2);
}
.accordion > summary::-webkit-details-marker{display:none}
.accordion > summary .chev{transition:transform .15s;color:var(--ink-faint)}
.accordion[open] > summary .chev{transform:rotate(90deg)}
.accordion .body{padding:.3rem .95rem .8rem}
.accordion .count{font-size:.72rem;color:var(--ink-faint);font-weight:400;margin-left:.5rem}

.group-name{font-size:.78rem;color:var(--ink-soft);font-weight:700;margin:.7rem 0 .35rem}
.item-row{padding:.55rem 0;border-top:1px solid var(--line)}
.item-row:first-of-type{border-top:none}
.item-row .label{font-size:.85rem;margin-bottom:.45rem}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.seg button{
  flex:1;min-width:84px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
  padding:.45rem .5rem;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;
}
.seg button[aria-pressed="true"]{border-color:transparent}
.seg button.st-good[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok)}
.seg button.st-action[aria-pressed="true"]{background:var(--ng-soft);color:var(--ng)}
.seg button.st-na[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.item-row select.code{
  margin-top:.4rem;border:1px solid var(--line-strong);border-radius:7px;padding:.35rem .5rem;
  font-size:.78rem;background:var(--surface);color:var(--ink);
}

.notebox{
  background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;
  font-size:.76rem;color:var(--ink-soft);line-height:1.6;margin:1rem 0;
}

.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;font-size:.82rem;margin-top:.6rem}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;word-break:break-all}

.empty{color:var(--ink-faint);font-size:.85rem;padding:1.2rem 0;text-align:center}

.certificate{
  background:#fff;color:#161616;width:780px;padding:28px 32px;font-family:"BIZ UDPGothic",sans-serif;
  position:absolute;left:-99999px;top:0;
}
.certificate h2{font-size:19px;text-align:center;margin-bottom:4px;font-family:"Noto Serif JP",serif}
.certificate .sub{text-align:center;font-size:11px;color:#666;margin-bottom:14px}
.certificate table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px}
.certificate table.head td{border:1px solid #999;padding:5px 8px}
.certificate table.head td.k{background:#f0efe9;font-weight:700;width:110px}
.certificate table.items{margin-top:6px}
.certificate table.items th{background:#e7eef2;border:1px solid #999;padding:4px 6px;font-size:11px;text-align:left}
.certificate table.items td{border:1px solid #bbb;padding:4px 6px;font-size:11px}
.certificate table.items tr.cat td{background:#f4f2ea;font-weight:700}
.certificate .res-good{color:#2f7a4f;font-weight:700}
.certificate .res-action{color:#b6432c;font-weight:700}
.certificate .res-na{color:#999}
.certificate .footer-grid{display:flex;justify-content:space-between;margin-top:16px;font-size:11px}
.certificate .footer-grid div{border-top:1px solid #999;padding-top:4px;width:31%}
.certificate .stamp{margin-top:18px;text-align:right;font-size:10px;color:#888}

body.printing .topbar, body.printing .container{display:none !important}
body.printing #certificate{
  display:block !important;position:static !important;left:auto !important;width:100% !important;padding:0 !important;
}
@media print{
  body{background:#fff}
  .topbar, .container{display:none !important}
  #certificate{
    display:block !important;position:static !important;left:auto !important;width:100% !important;padding:0 !important;
  }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="mark">QR</div>
  <div>
    <div class="title">点検QRポータル</div>
    <div class="sub">法定点検デジタル化</div>
  </div>
  <button class="back" id="btnHome" style="display:none">ホームへ</button>
</div>
<main id="app" class="container"></main>

<div id="certificate" class="certificate" aria-hidden="true"></div>

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;

function flatten(list){
  var out=[], idx=0;
  list.forEach(function(cat){
    cat.groups.forEach(function(g){
      g.items.forEach(function(label){
        idx++;
        out.push({id:"it"+idx, cat:cat.cat, group:g.name, label:label});
      });
    });
  });
  return out;
}
var FLAT_3M = flatten(CHECKLIST_3M);
var FLAT_6M = flatten(CHECKLIST_6M);
function flatFor(type){ return type==="3m" ? FLAT_3M : FLAT_6M; }
function checklistFor(type){ return type==="3m" ? CHECKLIST_3M : CHECKLIST_6M; }

/* ---------------- helpers ---------------- */
function $(sel,root){ return (root||document).querySelector(sel); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function norm(s){ return String(s==null?"":s).replace(/[\s　\-‐－]/g,"").toUpperCase(); }
function vehicleById(id){ return id ? BY_ID[String(id).trim().toUpperCase()] : null; }
function todayISO(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDateJP(iso){ if(!iso) return "未登録"; var p=iso.split("-"); return p[0]+"年"+(+p[1])+"月"+(+p[2])+"日"; }
function baseUrl(){ return location.origin + location.pathname; }
function setParams(obj){
  var u = new URL(baseUrl());
  Object.keys(obj).forEach(function(k){ if(obj[k]!=null) u.searchParams.set(k, obj[k]); });
  return u.toString();
}
function nav(obj){ location.href = setParams(obj); }
function genRecordId(){ return "R"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(); }
function safeName(s){ return String(s==null?"":s).replace(/[\s　\/\\:*?"<>|]/g,"_"); }

function searchVehicles(q, limit){
  var n = norm(q);
  if(!n) return [];
  var out = [];
  for(var i=0;i<VEHICLES.length && out.length<(limit||50);i++){
    var v = VEHICLES[i];
    if(norm(v.id).indexOf(n)>=0 || norm(v.reg).indexOf(n)>=0 || norm(v.chassis).indexOf(n)>=0) out.push(v);
  }
  return out;
}

  var v = vehicleById(record.vehicleId) || {reg:"",chassis:"",kind:"",office:"",id:record.vehicleId};

  flatFor(record.type).forEach(function(it){
    if(it.cat!==currentCat){
      rows += '<tr class="cat"><td colspan="2">'+esc(it.cat)+'</td></tr>';
      currentCat = it.cat;
    }
    var a = record.items[it.id] || {status:"good"};
    var resTxt, resCls;

function fillCertificate(record){
  var certEl = document.getElementById("certificate");
  certEl.innerHTML = renderCertificateHTML(record);
  return certEl;
}

async function buildPdfBlob(record){
  var certEl = fillCertificate(record);
  certEl.style.display = "block";
  await new Promise(function(r){ setTimeout(r, 60); });
  var canvas = await html2canvas(certEl, {scale:2, backgroundColor:"#ffffff"});
  certEl.style.display = "none";
  var imgData = canvas.toDataURL("image/png");
  var pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
  var pageW=210, pageH=297, margin=10;
  var imgW = pageW - margin*2;
  var imgH = canvas.height * imgW / canvas.width;
  var heightLeft = imgH, position = margin;
  pdf.addImage(imgData, "PNG", margin, position, imgW, imgH);
  heightLeft -= (pageH - margin*2);
  while(heightLeft > 0){
    position = margin - (imgH - heightLeft);
    pdf.addPage();
    pdf.addImage(imgData, "PNG", margin, position, imgW, imgH);
    heightLeft -= (pageH - margin*2);
  }
  return pdf.output("blob");
}

function pdfFileName(record){
  var v = vehicleById(record.vehicleId) || {reg:"", id:record.vehicleId};
  return record.dateISO.replace(/-/g,"") + "_" + safeName(v.id) + "_" + safeName(v.reg)
       + "_" + (record.type==="3m"?"3ヶ月":"6ヶ月") + ".pdf";
}

var app = document.getElementById("app");

function stopScan(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
  if(scanStream){ scanStream.getTracks().forEach(function(t){ t.stop(); }); scanStream=null; }
}

function render(){
  stopScan();
  var qs = new URLSearchParams(location.search);
  var mode = qs.get("mode") || "home";
  btnHome.style.display = mode==="home" ? "none" : "inline-flex";
  btnHome.onclick = function(){ nav({}); };

  if(mode==="scan")    return viewScan();
  if(mode==="vehicle") return viewVehicle(qs.get("v"));
  if(mode==="inspect") return viewInspect(qs.get("v"), qs.get("type"));
  return viewHome();
}

function viewScan(){
  app.innerHTML = ''
    + '<div id="scanStage">'
    + '<video id="scanVideo" playsinline muted></video>'
    + '<div class="scan-status" id="scanStatus">カメラを起動しています…</div>'
    + '<div class="scan-hint">車両のQRコードを枠内に写してください。<br>読み取れない場合は下から管理番号を直接入力できます。</div>'
    + '</div>'
    + '<div class="card" style="margin-top:1rem">'
    + '<div class="field"><label>管理番号を直接入力</label>'
    + '<input type="text" id="fManual" placeholder="例: DC2-0001" autocomplete="off"></div>'
    + '<div id="manualResults"></div>'
    + '</div>';

  var statusEl = $("#scanStatus"), video = $("#scanVideo");
  var manual = $("#fManual"), manualResults = $("#manualResults");

  manual.oninput = function(){
    var q = manual.value.trim();
    if(!q){ manualResults.innerHTML=""; return; }
    var hits = searchVehicles(q, 20);
    if(!hits.length){ manualResults.innerHTML = '<div class="empty">該当する車両がありません。</div>'; return; }
    manualResults.innerHTML = hitListHTML(hits);
    bindHits(manualResults);
  };

  function fail(msg){
    statusEl.className = "scan-status err";
    statusEl.textContent = msg;
    video.style.display = "none";
    manual.focus();
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    fail("この端末・ブラウザではカメラを使用できません。下の欄に管理番号を入力してください。");
    return;
  }

  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}})
    .then(function(stream){
      scanStream = stream;
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      return video.play();
    })
    .then(function(){
      statusEl.className = "scan-status";
      statusEl.textContent = "QRコードを探しています…";
      var canvas = document.createElement("canvas");
      var ctx = canvas.getContext("2d", {willReadFrequently:true});
      var done = false;
      scanTimer = setInterval(function(){
        if(done || !video.videoWidth) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var img;
        try{ img = ctx.getImageData(0,0,canvas.width,canvas.height); }catch(e){ return; }
        var code = jsQR(img.data, img.width, img.height, {inversionAttempts:"dontInvert"});
        if(!code || !code.data) return;
        var text = code.data.trim();
        var v = vehicleById(text);
        if(!v){
          statusEl.className = "scan-status err";
          statusEl.textContent = "「"+text+"」はマスタにありません";
          return;
        }
        done = true;
        statusEl.className = "scan-status ok";
        statusEl.textContent = "読み取りました: "+v.id;
        stopScan();
        setTimeout(function(){ nav({mode:"vehicle", v:v.id}); }, 350);
      }, 180);
    })
    .catch(function(err){
      var name = err && err.name;
      if(name === "NotAllowedError") fail("カメラの使用が許可されませんでした。ブラウザの許可設定を確認するか、管理番号を直接入力してください。");
      else if(name === "NotFoundError" || name === "OverconstrainedError") fail("使用できるカメラが見つかりませんでした。管理番号を直接入力してください。");
      else fail("カメラを起動できませんでした。管理番号を直接入力してください。");
    });
}

    + '</div>'
    + '<div class="field-row">'
    + '<div class="field"><label>車検証</label><div class="radio2"><label><input type="radio" name="fShaken" value="有" checked> 有</label><label><input type="radio" name="fShaken" value="無"> 無</label></div></div>'
    + '<div class="field"><label>三角停止板</label><div class="radio2"><label><input type="radio" name="fTri" value="有" checked> 有</label><label><input type="radio" name="fTri" value="無"> 無</label></div></div>'
    + '</div>'
    + '<div style="font-size:.76rem;color:var(--ink-soft)">車台番号: '+esc(v.chassis)+' ／ 車検満了日: '+esc(v.shakenDate?fmtDateJP(v.shakenDate):"未登録")+'</div>'
    + '</div>'
    + '<div class="section-label">点検項目（'+flat.length+'項目）</div>';

  list.forEach(function(cat, ci){
    var itemCount = 0; cat.groups.forEach(function(g){ itemCount+=g.items.length; });
    html += '<details class="accordion" '+(ci<2?"open":"")+'><summary>'+esc(cat.cat)+'<span class="count">'+itemCount+'項目</span><span class="chev">›</span></summary><div class="body">';
    cat.groups.forEach(function(g){
      if(g.name) html += '<div class="group-name">'+esc(g.name)+'</div>';
      g.items.forEach(function(label){
        var id = byKey[cat.cat+" "+(g.name||"")+" "+label];
        html += '<div class="item-row" data-item="'+id+'">'
          + '<div class="label">'+esc(label)+'</div>'
          + '<div class="seg">'
          + '<button type="button" class="st-good" data-status="good" aria-pressed="true">良好</button>'
          + '<button type="button" class="st-action" data-status="action" aria-pressed="false">要処置</button>'
          + '<button type="button" class="st-na" data-status="na" aria-pressed="false">該当なし</button>'
          + '</div>'
          + '<select class="code" style="display:none">'
          + ACTION_CODES.map(function(c){ return '<option value="'+esc(c.code)+'">'+esc(c.label)+'</option>'; }).join("")
          + '</select></div>';
      });
    });
    html += '</div></details>';
  });

  html += '<div class="notebox">下線のない項目は、車検証交付日または前回点検日以降の走行距離が基準以下の場合は省略できます。ただし前回省略した項目は今回必ず実施してください。（該当する場合は「該当なし」を選択）</div>'
    + '<div class="card"><div class="field"><label>特記事項</label><textarea id="fRemark" placeholder="気づいた点があれば記入してください"></textarea></div></div>'
    + '<button class="btn primary block" id="btnSubmit">点検を確定してPDFを作成</button>'
    + '<div id="submitMsg" style="font-size:.8rem;margin-top:.6rem;text-align:center"></div>';

  app.innerHTML = html;

  app.querySelectorAll(".item-row").forEach(function(row){
    var id = row.getAttribute("data-item");
    var codeSel = row.querySelector("select.code");
    row.querySelectorAll(".seg button").forEach(function(btn){
      btn.onclick = function(){
        row.querySelectorAll(".seg button").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
        btn.setAttribute("aria-pressed","true");
        var status = btn.getAttribute("data-status");
        answers[id].status = status;
        if(status==="action"){ codeSel.style.display="inline-block"; answers[id].code = codeSel.value; }
        else { codeSel.style.display="none"; answers[id].code = ""; }
      };
    });
    codeSel.onchange = function(){ answers[id].code = codeSel.value; };
  });

  $("#btnSubmit").onclick = async function(){
    var mileage = $("#fMileage").value;
    var inspector = $("#fInspector").value.trim();
    var msg = $("#submitMsg");
    if(!mileage || !inspector){
      msg.textContent = "点検時走行距離と点検実施者名を入力してください。";
      msg.style.color = "var(--ng)";
      return;
    }
    msg.textContent = "";
    var btn = $("#btnSubmit");
    btn.disabled = true; btn.textContent = "PDFを作成しています…";
    var record = {
      id: genRecordId(),
      vehicleId: v.id,
      type: type,
      dateISO: $("#fDate").value || todayISO(),
      mileage: mileage,
      inspector: inspector,
      manager: $("#fManager").value.trim(),
      shakenValid: (document.querySelector('input[name="fShaken"]:checked')||{}).value || "有",
      triangleValid: (document.querySelector('input[name="fTri"]:checked')||{}).value || "有",
      remark: $("#fRemark").value.trim(),
      items: answers,
      createdAt: new Date().toISOString()
    };
    try{
      var blob = await buildPdfBlob(record);
      viewDeliver(record, blob);
      window.scrollTo(0,0);
    }catch(e){
      btn.disabled = false; btn.textContent = "点検を確定してPDFを作成";
      msg.textContent = "PDFの作成に失敗しました。もう一度お試しください。";
      msg.style.color = "var(--ng)";
    }
  };
}

/* ---------------- 完成後：会社PCへ送る / 保存 / 印刷 ---------------- */
function viewDeliver(record, blob){
  var v = vehicleById(record.vehicleId);
  var fname = pdfFileName(record);
  btnHome.style.display = "inline-flex";

  app.innerHTML = ''
    + '<div class="card" style="text-align:center;padding:1.6rem 1.2rem">'
    + '<div style="font-size:2rem">✅</div>'
    + '<h2 style="margin:.5rem 0 .3rem;font-size:1.15rem">記録簿PDFを作成しました</h2>'
    + '<div style="color:var(--ink-soft);font-size:.84rem">'+esc(v.reg)+' ／ '+esc(TYPE_LABEL[record.type])+'</div>'
    + '<div style="color:var(--ink-faint);font-size:.74rem;margin-top:.35rem;word-break:break-all">'+esc(fname)+'</div>'
    + '</div>'
    + '<div class="section-label">この後の手順</div>'
    + '<button class="step-btn" id="stepShare"><div class="num">1</div><div class="txt">'
      + '<div class="t">📤 会社PCへ送信</div>'
      + '<div class="d">メール・Teams・LINE等の送信先を選んで、このPDFを会社のPCへ送ります。</div></div></button>'
    + '<button class="step-btn" id="stepSave"><div class="num">2</div><div class="txt">'
      + '<div class="t">💾 この端末に保存</div>'
      + '<div class="d">先に端末へ保存し、後でまとめて送る場合はこちら。</div></div></button>'
    + '<button class="step-btn" id="stepPrint"><div class="num">3</div><div class="txt">'
      + '<div class="t">🖨 印刷して車両に保管</div>'
      + '<div class="d">会社PCで受け取った後、1部印刷して車検証入れに同封します。事故時に第三者へその場で提示できます。</div></div></button>'
    + '<div id="deliverMsg" style="font-size:.8rem;margin:.6rem 0;text-align:center;color:var(--ink-soft)"></div>'
    + '<div class="notebox">この記録は社外には公開されません。事故対応で第三者に示す必要がある場合は、<b>車内に保管した印刷済みの記録簿</b>を提示してください。</div>'
    + '<div class="rowbtns" style="justify-content:center;margin-top:1rem">'
    + '<button class="btn" id="btnNext">次の車両をスキャン</button>'
    + '</div>';

  var msg = $("#deliverMsg");
  function say(text, kind){
    msg.textContent = text;
    msg.style.color = kind==="err" ? "var(--ng)" : (kind==="ok" ? "var(--ok)" : "var(--ink-soft)");
  }
  function markDone(el){ el.classList.add("done"); el.querySelector(".num").textContent = "✓"; }

  $("#stepShare").onclick = async function(){
    var btn = this;
    try{
      var file = new File([blob], fname, {type:"application/pdf"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:fname, text:v.reg+" "+TYPE_LABEL[record.type]});
        markDone(btn);
        say("送信先アプリに渡しました。", "ok");
      } else {
        say("この端末では共有機能が使えません。「この端末に保存」してから、メール等で送ってください。", "err");
      }
    }catch(e){
      if(e && e.name === "AbortError") say("送信を取り消しました。");
      else say("共有できませんでした。「この端末に保存」してから、メール等で送ってください。", "err");
    }
  };

  $("#stepSave").onclick = async function(){
    var btn = this;
    say("保存しています…");
    var dl = null;
    try{ dl = await claude.use("downloads"); }catch(e){ dl = null; }
    if(!dl){ say("この画面では保存機能が使えません。「会社PCへ送信」をお使いください。", "err"); return; }
    try{
      await dl.save({filename:fname, data:blob});
      markDone(btn);
      say("端末に保存しました。", "ok");
    }catch(e){
      say("保存されませんでした。もう一度お試しください。", "err");
    }
  };

  $("#stepPrint").onclick = function(){
    fillCertificate(record);
    document.body.classList.add("printing");
    window.print();
    setTimeout(function(){ document.body.classList.remove("printing"); }, 500);
    markDone(this);
  };

  $("#btnNext").onclick = function(){ nav({mode:"scan"}); };
}

window.addEventListener("popstate", render);
window.addEventListener("pagehide", stopScan);
render();

})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function (e) {
      console.warn("Service Worker の登録に失敗しました:", e);
    });
  });
}
</script>
