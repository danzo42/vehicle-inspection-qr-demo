<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12508f">
<!-- iPhone：ホーム画面に追加したときアプリのように全画面で開く -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="法定点検">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>車両 - 車両法定点検</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="appbar">
  <a class="back" href="index.html">&#8592;</a>
  <h1>車両情報</h1>
  <span class="env" id="env-label">―</span>
</div>

<main>
  <div id="content">
    <p class="muted">読み込み中…</p>
  </div>
</main>

<script src="config/app-config.js"></script>
<script src="config/firebase-config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="vendor/firebase-storage-compat.js"></script>
<script src="src/common/util.js"></script>
<script src="src/storage/StorageAdapter.js"></script>
<script src="src/storage/LocalStorageAdapter.js"></script>
<script src="src/storage/FirebaseStorageAdapter.js"></script>
<script src="src/auth/AuthProvider.js"></script>
<script src="src/storage/storageFactory.js"></script>
<script>
/* ---------------------------------------------------------------------------
 * 車両確認画面：QRで読んだ車両が正しいか確認し、点検に進む（または点検履歴を見る）
 * ------------------------------------------------------------------------ */
(async function () {
  const VIS = window.VIS, util = VIS.util, $ = util.$;
  await VIS.ready();
  $('#env-label').textContent = VIS.storage.name;

  const id = util.normalizeVehicleId(util.param('id'));
  const box = $('#content');

  if (!id) {
    box.innerHTML = '<div class="banner err">管理番号が指定されていません。</div>' +
                    '<a class="btn" href="index.html">QR読み取りに戻る</a>';
    return;
  }

  const vehicle = await VIS.storage.getVehicle(id);
  if (!vehicle) {
    box.innerHTML = `<div class="banner err">「${util.esc(id)}」は車両マスタに登録されていません。</div>
                     <a class="btn" href="index.html">QR読み取りに戻る</a>`;
    return;
  }

  const cycleLabel = vehicle.inspectionCycle === '6month' ? '６ヶ月定期点検' : '３ヶ月定期点検';
  const latest = await VIS.storage.getLatestInspection(id);

  box.innerHTML = `
    <div class="vehicle-head">
      <div class="vid">${util.esc(vehicle.vehicleId)}</div>
      <div class="vtype">${util.esc(vehicle.vehicleType)}　/　${util.esc(cycleLabel)}</div>
    </div>

    <div class="card">
      <dl class="kv">
        <dt>自動車登録番号</dt><dd>${util.esc(vehicle.plateNumber || '―')}</dd>
        <dt>型式・車台番号</dt><dd>${util.esc([vehicle.modelCode, vehicle.chassisNo].filter(Boolean).join(' ') || '―')}</dd>
        <dt>メーカー</dt><dd>${util.esc(vehicle.maker || '―')}</dd>
        <dt>営業所 / ヤード</dt><dd>${util.esc([vehicle.branch, vehicle.yard].filter(Boolean).join(' / ') || '―')}</dd>
        <dt>前回点検</dt><dd>${latest ? util.formatDateTime(latest.inspectedAt) : '記録なし'}</dd>
      </dl>
    </div>

    <div class="card">
      <a class="btn big" href="inspect.html?id=${encodeURIComponent(id)}">点検を実施する</a>
      <a class="btn big secondary" href="view.html?id=${encodeURIComponent(id)}">点検履歴を見る</a>
    </div>
  `;
})();
</script>
</body>
</html>
